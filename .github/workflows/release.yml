# SPDX-FileCopyrightText: 2026 Tamer Osman
#
# Standalone, ready-to-run distributions for Windows, macOS and Linux.
#
# Every platform builds its own archive in scripts/standalone/package.sh:
# the compiled C11 kernel, the vanilla web app (server.py + web/), the engine
# with reportlab/pypdf preinstalled, and the bundled CPython runtime - an
# unpacked archive runs with no prerequisites (no Python, no compiler, and
# no Node.js anywhere).
#
#   kernel smoke    each platform compiles the kernel with the repo's
#                   bit-identical flags and runs the real engine (bundled
#                   python + that kernel) against the demo corpus before
#                   anything is packaged.
#   boot smoke      Linux additionally extracts the finished archive and
#                   verifies the bundled server answers an API request and
#                   serves the PWA install layer (manifest + service worker).
#
# Triggers:
#   - push a v* tag: the release is created first, then all three archives are
#     built in parallel and attached to that release (with generated notes).
#   - workflow_dispatch: builds and uploads the archives as workflow
#     artifacts only - use this to test the packaging without a release.
#
# Free tier: public repos run these on GitHub-hosted runners at no cost.
# The tag builds need `permissions: contents: write` to attach assets;
# nothing else is granted.
#
# Release sequencing follows the canonical multi-platform Actions pattern:
# the create_release job materialises the GitHub Release before any asset
# upload runs, so the matrix jobs never race to create-or-attach the same
# release. See https://jon.sprig.gs/blog/post/2442.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create_release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      tag-name: ${{ steps.create_release.outputs.tag-name }}
    steps:
      - name: Create the GitHub Release (tag builds only)
        id: create_release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true

  build_release:
    name: Standalone (${{ matrix.platform }})
    needs: [create_release]
    if: always()
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc x86_64 - covers every mainstream 64-bit Linux distro
          - os: ubuntu-24.04
            platform: linux-x64
          # Apple Silicon; the kernel is built universal (arm64 + x86_64)
          - os: macos-latest
            platform: macos-arm64
          # x64 Windows 10/11 - gcc is the Strawberry Perl mingw-w64
          # toolchain that ships with the runner images
          - os: windows-latest
            platform: windows-x64
    steps:
      - uses: actions/checkout@v6

      - name: Package the standalone distribution
        shell: bash
        run: bash scripts/standalone/package.sh

      - name: Boot smoke (extract and serve)
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/boot" && cd "$RUNNER_TEMP/boot"
          tar -xzf "$GITHUB_WORKSPACE/dist/job-attune-standalone-linux-x64.tar.gz"
          cd job-attune-standalone-linux-x64
          ./start.sh &
          SERVER_PID=$!
          ok=""
          for i in $(seq 1 30); do
            if curl -sf -H "X-Attune-Client: cli" http://127.0.0.1:3000/api/template >/dev/null; then
              ok="yes"; break
            fi
            sleep 1
          done
          if [ "$ok" != "yes" ]; then
            kill "$SERVER_PID" 2>/dev/null || true
            echo "boot smoke: the packaged server never answered /api/template" >&2
            exit 1
          fi
          echo "boot smoke OK: packaged server answered /api/template"
          # The PWA install layer rides along in web/ - prove it survived
          # packaging (static assets need no guard header; the server must
          # still be running here, so these run BEFORE the kill below).
          curl -sf http://127.0.0.1:3000/manifest.webmanifest | grep -q '"short_name"'
          curl -sf -o /dev/null http://127.0.0.1:3000/sw.js
          curl -sf -o /dev/null http://127.0.0.1:3000/icons/icon-512.png
          echo "boot smoke OK: PWA manifest + service worker served"
          kill "$SERVER_PID" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: job-attune-standalone-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

      - name: Attach the archives to the GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag-name: ${{ needs.create_release.outputs.tag-name }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256