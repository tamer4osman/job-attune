<svg version="1.1" xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 64 64" role="img" aria-label="Job Attune logo">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d473c"/>
      <stop offset="0.55" stop-color="#09352d"/>
      <stop offset="1" stop-color="#062822"/>
    </linearGradient>
  </defs>

  <!-- rounded tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#tile)"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="15.25"
        fill="none" stroke="#fefae7" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- resonance halo above the apex -->
  <path d="M 26.4 10.8 A 7 7 0 0 1 37.6 10.8"
        fill="none" stroke="#f26c17" stroke-width="2.4"
        stroke-linecap="round" opacity="0.95"/>

  <!-- tuning-fork A: two prongs -->
  <path d="M 32 15 L 19.5 51"
        fill="none" stroke="#fefae7" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M 32 15 L 44.5 51"
        fill="none" stroke="#fefae7" stroke-width="5.5" stroke-linecap="round"/>

  <!-- orange crossbar -->
  <path d="M 25.6 36.5 L 38.4 36.5"
        fill="none" stroke="#f26c17" stroke-width="5.5" stroke-linecap="round"/>
</svg>
