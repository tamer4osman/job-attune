# Ruff gate for the Python side (server, engine, bench, QA scripts).
#
# This is the Python analog of `fallow dead-code` + `fallow`'s
# stale-suppression rule: pyflakes (F) catches unused imports/variables and
# undefined names, RUF059 unused unpacking targets, RUF100 `# noqa` directives
# that no longer suppress anything, and E4/E7/E9 the pycodestyle error tier.
# I (import order) keeps the module heads merge-friendly.
#
# Deliberately NOT selected (see docs/CODEBASE-INTEL.md for the full story):
#   UP*  pyupgrade modernizations - cosmetic churn, no defect signal
#   BLE001 blind except          - the server and QA scripts degrade on
#                                  purpose; reasons live in inline comments
#   S/SIM/ISC/PLW/...            - advisory sets the codebase intentionally
#                                  does not follow
#
# Wire-up: .github/workflows/codebase-intel.yml -> scripts/codebase_intel.py.

line-length = 100

# analyzer support files (the whitelist intentionally references unused names)
# and QA scratch output regenerated by every check_python_side.py run
exclude = [".codebase-intel", "scripts/tmp_pycheck", ".fallow", ".git"]

[lint]
select = ["E4", "E7", "E9", "F", "I", "RUF059", "RUF100"]

[lint.isort]
known-first-party = ["ckernel", "floors"]
# ruff 0.17.x defaults combine-as-imports to false, so a single
# `from kernel_contract import (...)` block mixing plain names and
# `as`-aliased names is flagged.  The kernel-bridge modules import a
# large, stable contract surface under aliases (to avoid clashing with
# the engine's own helpers); splitting that block into 8 single-line
# imports would make every future contract edit a merge nightmare.
# This keeps the block as one sorted unit.
combine-as-imports = true
